<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>og-card generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  /* Служебная страница: из неё снимается og-card.png 1200x630. В продакшене не нужна. */
  html, body { margin: 0; padding: 0; background: var(--night); }
  body { background-image: none; overflow: hidden; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 56px 64px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--night);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: -180px; right: -140px;
    width: 640px; height: 640px;
    background: radial-gradient(circle, rgba(var(--lamp-rgb), .16), rgba(var(--lamp-rgb), 0) 68%);
    filter: blur(80px);
  }
  .card__top, .card__bottom, .hero-chart { position: relative; z-index: 1; }
  .card__eyebrow {
    font-family: var(--font-body);
    font-size: 19px; font-weight: 500; letter-spacing: 0.04em; color: var(--mist);
  }
  .hero-chart { width: 100%; margin: 4px 0 0; }
  .card__big {
    font-family: var(--font-display);
    font-size: 64px; line-height: 1.1; color: var(--moon);
  }
  .card__sign {
    margin-top: 14px;
    font-family: var(--font-body);
    font-size: 20px; color: var(--mist);
  }
</style>
</head>
<body>
<div class="card">
  <div class="card__top">
    <p class="card__eyebrow">Семь вечеров · до и после</p>
  </div>
  <div id="hero-chart" class="hero-chart" role="img" aria-label="График семи вечеров"></div>
  <div class="card__bottom">
    <p class="card__big">Было 4. Стало 7.</p>
    <p class="card__sign">Семь ночей · [[Анна]]</p>
  </div>
</div>
<script src="chart.js"></script>
</body>
</html>
