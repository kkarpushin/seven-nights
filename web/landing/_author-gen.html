<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>author placeholder generator</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Служебная страница: из неё снимается img/author.jpg 480x480 — заглушка портрета. */
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { background-image: none; background: var(--dusk); }
  .ph {
    position: relative;
    width: 480px; height: 480px;
    display: grid; place-items: center;
    background:
      radial-gradient(circle at 50% 34%, rgba(var(--lamp-rgb), .16), rgba(var(--lamp-rgb), 0) 62%),
      linear-gradient(160deg, #232852 0%, #1A1E4A 60%, #151838 100%);
  }
  .ph__figure { width: 260px; height: 300px; }
  .ph__label {
    position: absolute; left: 0; right: 0; bottom: 30px;
    text-align: center;
    font-family: var(--font-body);
    font-size: 15px; letter-spacing: 0.06em; color: var(--mist); opacity: .7;
  }
</style>
</head>
<body>
<div class="ph">
  <svg class="ph__figure" viewBox="0 0 260 300" aria-hidden="true">
    <circle cx="130" cy="96" r="58" fill="none" stroke="#A9ACC8" stroke-opacity=".4" stroke-width="2"/>
    <path d="M28 288c0-58 46-102 102-102s102 44 102 102" fill="none" stroke="#A9ACC8" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <p class="ph__label">портрет 480 × 480</p>
</div>
</body>
</html>
